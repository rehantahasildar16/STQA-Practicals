<!DOCTYPE html>
<html>
<head>
<title>Student Table</title>

<script>

function sortTable(){

var table=document.getElementById("studentTable");
var rows=Array.from(table.rows).slice(1);

rows.sort(function(a,b){
return a.cells[0].innerHTML.localeCompare(b.cells[0].innerHTML);
});

for(var i=0;i<rows.length;i++){
table.appendChild(rows[i]);
}
}

function searchTable(){

var input=document.getElementById("search").value.toUpperCase();
var table=document.getElementById("studentTable");
var tr=table.getElementsByTagName("tr");

for(var i=1;i<tr.length;i++){

var td=tr[i].getElementsByTagName("td")[1];

if(td){

if(td.innerHTML.toUpperCase().indexOf(input)>-1)
tr[i].style.display="";

else
tr[i].style.display="none";

}
}

}

</script>

</head>

<body>

<h2 align="center">Student Information</h2>

<input type="text" id="search" placeholder="Search Course">

<button onclick="searchTable()">Search</button>

<button onclick="sortTable()">Sort By Name</button>

<br><br>
